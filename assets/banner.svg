<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Pulse Animation Styles -->
    <style>
      .node-pulse {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      .node-pulse-2 {
        animation: pulse 2.5s ease-in-out 1s infinite alternate;
      }
      .node-pulse-3 {
        animation: pulse 3.5s ease-in-out 0.5s infinite alternate;
      }
      .flow-line {
        stroke-dasharray: 8, 8;
        animation: flowDash 20s linear infinite;
      }
      .flow-line-reverse {
        stroke-dasharray: 6, 6;
        animation: flowDashReverse 15s linear infinite;
      }
      .badge-glow {
        animation: badgePulse 4s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { opacity: 0.35; transform: scale(0.97); }
        100% { opacity: 0.85; transform: scale(1.03); }
      }
      @keyframes badgePulse {
        0% { filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.3)); }
        100% { filter: drop-shadow(0 0 10px rgba(192, 132, 252, 0.7)); }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -320; }
      }
      @keyframes flowDashReverse {
        to { stroke-dashoffset: 320; }
      }
    </style>
  </defs>

  <!-- Background Rect -->
  <rect width="1200" height="360" fill="url(#bgGradient)" rx="16" />
  <rect width="1200" height="360" fill="url(#grid)" rx="16" />

  <!-- DYNAMIC AMBIENT / BACKGROUND FLOWS (Kept low opacity and behind text) -->
  <g opacity="0.35">
    <!-- Connecting flow paths -->
    <path d="M 60 70 Q 300 20 600 80 T 1140 60" fill="none" stroke="#38bdf8" stroke-width="2" class="flow-line" />
    <path d="M 80 300 Q 400 340 700 290 T 1120 310" fill="none" stroke="#818cf8" stroke-width="2" class="flow-line-reverse" />
    <path d="M 150 120 C 350 260 850 40 1050 200" fill="none" stroke="#c084fc" stroke-width="1.5" class="flow-line" />

    <!-- Ambient glowing nodes -->
    <circle cx="120" cy="70" r="16" fill="#0284c7" opacity="0.4" class="node-pulse" />
    <circle cx="1080" cy="90" r="22" fill="#7c3aed" opacity="0.3" class="node-pulse-2" />
    <circle cx="160" cy="290" r="14" fill="#6366f1" opacity="0.4" class="node-pulse-3" />
    <circle cx="1040" cy="280" r="18" fill="#0ea5e9" opacity="0.35" class="node-pulse" />
    <circle cx="600" cy="40" r="10" fill="#a855f7" opacity="0.5" class="node-pulse-2" />
  </g>

  <!-- CENTRAL BACKDROP CONTAINER TO SHIELD TEXT CLEARLY -->
  <rect x="140" y="35" width="920" height="290" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="drop-shadow(0 16px 32px rgba(0, 0, 0, 0.45))" />

  <!-- DECORATIVE PILLS INSIDE CONTAINER (Behind text) -->
  <g opacity="0.75">
    <rect x="180" y="55" width="120" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8" />
    <text x="240" y="72" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">☁️ CLOUD iPaaS</text>

    <rect x="900" y="55" width="120" height="26" rx="13" fill="#1e293b" stroke="#c084fc" stroke-width="0.8" />
    <text x="960" y="72" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚡ OPEN SOURCE</text>
  </g>

  <!-- FOREGROUND BRANDING AND TEXT (Guaranteed Foreground & Readability) -->
  <g text-anchor="middle">
    <!-- Icon / Sparkle Tag -->
    <text x="600" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#a5b4fc" letter-spacing="3" text-transform="uppercase">
      ✦ ENTERPRISE &amp; COMMUNITY INTEGRATION DIRECTORY ✦
    </text>

    <!-- Main Title with Gradient Glow -->
    <text x="600" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" fill="url(#primaryGlow)" letter-spacing="-0.5" class="badge-glow">
      Awesome Cloud Integration iPaaS
    </text>

    <!-- Subtitle -->
    <text x="600" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
      Curated Catalog of Enterprise iPaaS, Workflow Automation &amp; Modern Open-Source Platforms
    </text>

    <!-- Technology / Feature Badges in Footer of Card -->
    <g transform="translate(0, 245)">
      <!-- Badge 1: API-Led Connectivity -->
      <g transform="translate(230, 0)">
        <rect x="0" y="0" width="160" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <circle cx="20" cy="18" r="5" fill="#38bdf8" />
        <text x="90" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">API &amp; Event-Driven</text>
      </g>

      <!-- Badge 2: Workflow Automation -->
      <g transform="translate(415, 0)">
        <rect x="0" y="0" width="180" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <circle cx="20" cy="18" r="5" fill="#818cf8" />
        <text x="100" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">Workflow Automation</text>
      </g>

      <!-- Badge 3: ETL & Data Sync -->
      <g transform="translate(620, 0)">
        <rect x="0" y="0" width="150" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <circle cx="20" cy="18" r="5" fill="#a855f7" />
        <text x="85" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">ETL / ELT Pipelines</text>
      </g>

      <!-- Badge 4: AI Agents & Orchestration -->
      <g transform="translate(795, 0)">
        <rect x="0" y="0" width="175" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <circle cx="20" cy="18" r="5" fill="#ec4899" />
        <text x="98" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">AI &amp; Agentic Workflows</text>
      </g>
    </g>

    <!-- Bottom Metadata / Highlights -->
    <text x="600" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#94a3b8">
      🔥 Verified 2026 Starting Pricing • Free Tier Limits • Valuation Metrics • Stargazers Ranking
    </text>
  </g>
</svg>
